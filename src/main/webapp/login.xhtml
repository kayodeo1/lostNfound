<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Sign In &#8211; Lost &amp; Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <f:metadata>
        <f:viewAction action="#{authBean.redirectIfLoggedIn}"/>
    </f:metadata>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0D1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,.18) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 10%, rgba(139,92,246,.14) 0%, transparent 50%);
        }
        .auth-card {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 28px 80px rgba(0,0,0,.55);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #0D1117 0%, #1E1B4B 60%, #312E81 100%);
            padding: 36px 28px 28px;
            text-align: center;
        }
        .auth-logo {
            width: 56px; height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 14px;
        }
        .auth-header h1 { font-size: 1.25rem; font-weight: 800; color: #F1F5F9; margin-bottom: 5px; letter-spacing: -.02em; }
        .auth-header p  { font-size: .82rem; color: rgba(148,163,184,.8); }
        .auth-body { padding: 28px; }
        .field-group { margin-bottom: 16px; }
        .field-group label {
            display: block; font-size: .82rem; font-weight: 600;
            color: #374151; margin-bottom: 5px;
        }
        .field-group .ui-inputtext,
        .field-group .ui-password input {
            width: 100% !important;
            padding: 10px 13px !important;
            border: 1.5px solid #E2E8F0 !important;
            border-radius: 9px !important;
            font-size: .875rem !important;
            font-family: 'Inter', system-ui, sans-serif !important;
            color: #0F172A !important;
            transition: border-color .15s, box-shadow .15s !important;
        }
        .field-group .ui-inputtext:focus,
        .field-group .ui-password input:focus {
            border-color: #6366F1 !important;
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(99,102,241,.12) !important;
        }
        .field-group .ui-password { width: 100% !important; }
        .btn-auth {
            width: 100%;
            padding: 11px !important;
            background: linear-gradient(135deg, #6366F1, #4F46E5) !important;
            color: #fff !important;
            border: none !important;
            border-radius: 10px !important;
            font-size: .9rem !important;
            font-weight: 700 !important;
            font-family: 'Inter', system-ui, sans-serif !important;
            letter-spacing: -.01em !important;
            cursor: pointer !important;
            margin-top: 4px !important;
            box-shadow: 0 4px 14px rgba(99,102,241,.35) !important;
            transition: box-shadow .15s !important;
        }
        .btn-auth:hover { box-shadow: 0 6px 20px rgba(99,102,241,.45) !important; }
        .auth-footer { text-align: center; margin-top: 18px; font-size: .83rem; color: #64748B; }
        .auth-footer a { color: #6366F1; font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .ui-messages { margin-bottom: 14px; border-radius: 10px !important; }
        .ui-widget { font-family: 'Inter', system-ui, sans-serif !important; }
    </style>
</h:head>
<h:body>
    <div class="bg-pattern"/>
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">&#128269;</div>
            <h1>Lost &amp; Found</h1>
        </div>
        <div class="auth-body">
            <h:form id="loginForm">
                <p:messages id="msgs" globalOnly="true" showDetail="true" closable="true"/>

                <div class="field-group">
                    <label for="email">Email Address</label>
                    <p:inputText id="email" value="#{authBean.loginEmail}"
                        required="true" requiredMessage="Email is required"
                        placeholder="you@example.com" style="width:100%;"/>
                    <p:message for="email"/>
                </div>

                <div class="field-group">
                    <label for="pass">Password</label>
                    <p:password id="pass" value="#{authBean.loginPassword}"
                        required="true" requiredMessage="Password is required"
                        feedback="false" placeholder="Enter your password" style="width:100%;"/>
                    <p:message for="pass"/>
                </div>

                <p:commandButton value="Sign In"
                    actionListener="#{authBean.login}"
                    process="loginForm"
                    update="msgs"
                    styleClass="btn-auth"/>

                <div class="auth-footer">
                    Don't have an account? <a href="register.xhtml">Create one</a>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
